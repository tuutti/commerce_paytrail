parameters:
  commerce_paytrail.callback_delay: 120
services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.commerce_paytrail:
    parent: logger.channel_base
    arguments: ['commerce_paytrail']

  Drupal\commerce_paytrail\RequestBuilder\RefundRequestBuilder: ~
  Drupal\commerce_paytrail\RequestBuilder\RefundRequestBuilderInterface: '@Drupal\commerce_paytrail\RequestBuilder\RefundRequestBuilder'

  Drupal\commerce_paytrail\RequestBuilder\PaymentRequestBuilder: ~
  Drupal\commerce_paytrail\RequestBuilder\PaymentRequestBuilderInterface: '@Drupal\commerce_paytrail\RequestBuilder\PaymentRequestBuilder'

  Drupal\commerce_paytrail\RequestBuilder\TokenRequestBuilder: ~
  Drupal\commerce_paytrail\RequestBuilder\TokenRequestBuilderInterface: '@Drupal\commerce_paytrail\RequestBuilder\TokenRequestBuilder'

  Drupal\commerce_paytrail\Http\PaytrailClientFactory: ~

  Drupal\commerce_paytrail\EventSubscriber\BillingInformationCollector: ~
